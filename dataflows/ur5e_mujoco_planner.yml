# Week 11 — the mock agent driving the COLLISION-CHECKED real planner on the real
# MuJoCo sim. This is the CI-runnable counterpart of ur5e_mujoco_planner_llm.yml:
# same pipeline (rrt_planner -> trajectory_executor -> real sim), but the scripted
# mock provider drives it so it runs deterministically without an API key.
#
#   mujoco_sim -> agent_bridge -> rrt_planner (collision on) -> trajectory
#              -> trajectory_executor -> real sim
#
# The planner now checks every configuration against the table via the
# MuJoCo-exact UR5e FK (COLLISION=1), so the path it returns is collision-free.
#
#   bash scripts/fetch_ur5e_assets.sh                      # one-time meshes
#   MUJOCO_HEADLESS=1 dora run dataflows/ur5e_mujoco_planner.yml --stop-after 60s

nodes:
  # --- Real UR5e + Robotiq MuJoCo simulation (this repo, Week 1). ---
  - id: mujoco_sim
    path: ../simulation/mujoco_node.py
    inputs:
      tick: dora/timer/millis/10
      control_input: trajectory_executor/control_input
      gripper_ctrl: gripper_controller/gripper_ctrl
    outputs:
      - joint_positions
      - joint_velocities
      - sensor_data
    env:
      MUJOCO_HEADLESS: "1"
      SIM_SUBSTEPS: "24"

  # --- RRT-Connect planner with real collision checking (this repo node,
  #     dora-moveit2 algorithm). plan_request -> plan_status + trajectory. ---
  - id: rrt_planner
    path: ../simulation/rrt_planner_node.py
    inputs:
      plan_request: agent_bridge/plan_request
      scene_command: agent_bridge/scene_command
    outputs:
      - plan_status
      - trajectory
      - scene_result
    env:
      ROBOT_CONFIG_MODULE: simulation.ur5e_moveit_config
      PLANNER_TYPE: rrt_connect
      PLANNER_MAX_TIME: "5.0"
      COLLISION: "1"

  # --- Trajectory executor: follow the planned path on the real sim. ---
  - id: trajectory_executor
    path: ../simulation/trajectory_executor_node.py
    inputs:
      tick: dora/timer/millis/50
      trajectory: rrt_planner/trajectory
      joint_positions: mujoco_sim/joint_positions
    outputs:
      - control_input
      - execution_status

  # --- Robotiq 2F-85 gripper controller (this repo, Week 2). ---
  - id: gripper_controller
    path: ../simulation/gripper_controller.py
    inputs:
      gripper_command: agent_bridge/gripper_command
    outputs:
      - gripper_ctrl
      - gripper_status

  # --- Agent bridge, scripted mock provider (no API key). ---
  - id: agent_bridge
    path: ../agent/bridge_node.py
    inputs:
      user_command: mission_source/user_command
      joint_positions: mujoco_sim/joint_positions
      plan_status: rrt_planner/plan_status
      execution_status: trajectory_executor/execution_status
      gripper_status: gripper_controller/gripper_status
      scene_result: rrt_planner/scene_result
    outputs:
      - plan_request
      - ik_request
      - scene_command
      - cartesian_trajectory
      - gripper_command
      - agent_response
    env:
      OCTOS_PROVIDER: mock
      OCTOS_SKILLS_DIR: ../skills

  # --- Mission source: one natural-language mission, then logs the reply. ---
  - id: mission_source
    path: ../simulation/mission_source.py
    inputs:
      tick: dora/timer/millis/2000
      agent_response: agent_bridge/agent_response
    outputs:
      - user_command
    env:
      MISSION: "Pick up the red ball and place it on the green plate."
