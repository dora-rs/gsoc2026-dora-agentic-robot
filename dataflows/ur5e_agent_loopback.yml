# Week 7 — Agent loopback dataflow: a real dora run with no external dependencies.
#
# `ur5e_agent_demo.yml` is the live target — real planner, real IK, real MuJoCo —
# but it needs dora-moveit2 installed and meshes fetched, so it cannot run in CI.
# This dataflow keeps the *agent* side completely real (same bridge node, same
# skills, same tools, same wire formats) and swaps the motion stack for
# `pipeline_stub`, which speaks the planner/executor/sim contract in ~100 lines.
#
# Everything here is a real dora node in its own process talking over real dora
# IPC, so `tests/test_integration_dataflow.py` can run the whole thing and assert
# the agent completed a pick-and-place. That is the CI-runnable half of the
# "does the dataflow actually work" question; the live half is ur5e_agent_demo.yml.
#
#   mission_source -> agent_bridge -> pipeline_stub     (plan/execute/state)
#                                  -> gripper_controller (real Week 2 node)
#
# Run (no dora-moveit2, no MuJoCo, no API key, no display):
#   dora run dataflows/ur5e_agent_loopback.yml --stop-after 60

nodes:
  # --- Motion stack stand-in: planner + executor + sim in one node. ---
  - id: pipeline_stub
    path: ../simulation/pipeline_stub.py
    inputs:
      tick: dora/timer/millis/500
      plan_request: agent_bridge/plan_request
    outputs:
      - joint_positions
      - plan_status
      - execution_status
    env:
      START_POSE: home

  # --- Robotiq 2F-85 gripper controller (this repo, Week 2 — the real node). ---
  - id: gripper_controller
    path: ../simulation/gripper_controller.py
    inputs:
      gripper_command: agent_bridge/gripper_command
    outputs:
      - gripper_ctrl
      - gripper_status

  # --- Agent bridge: the same node as the live dataflow, unchanged. ---
  - id: agent_bridge
    path: ../agent/bridge_node.py
    inputs:
      user_command: mission_source/user_command
      joint_positions: pipeline_stub/joint_positions
      plan_status: pipeline_stub/plan_status
      execution_status: pipeline_stub/execution_status
      gripper_status: gripper_controller/gripper_status
    outputs:
      - plan_request
      - ik_request
      - scene_command
      - cartesian_trajectory
      - gripper_command
      - agent_response
    env:
      OCTOS_PROVIDER: mock
      OCTOS_SKILLS_DIR: ../skills

  # --- Mission source: one natural-language mission, then logs the reply. ---
  - id: mission_source
    path: ../simulation/mission_source.py
    inputs:
      tick: dora/timer/millis/2000
      agent_response: agent_bridge/agent_response
    outputs:
      - user_command
    env:
      MISSION: "Pick up the red ball and place it on the green plate."
