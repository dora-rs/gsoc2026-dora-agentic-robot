[project]
name = "gsoc2026-dora-agentic-robot"
version = "0.1.0"
description = "Agentic DORA — agent-driven robot control. Week 1: UR5e MuJoCo simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gary Ding", email = "gary.d.ding.27@dartmouth.edu" }]
dependencies = [
    "dora-rs >= 0.3",
    "mujoco >= 3.1",
    "numpy >= 1.24",
    "pyarrow >= 14",
]

[project.optional-dependencies]
dev = ["pytest >= 7"]

[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simulation", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
